# Devices Configuration - Production (Raspberry Pi)
# This is the source of truth for all device definitions (gates, utilities)
# Changes here will be synced to the database on reload
#
# Device Types:
#   gate - Controllable gate with open/close/stop actions
#   utility - Light switch or other toggle device with on/off/toggle actions
#
# GPIO Pin Assignments:
#   North Gate: GPIO 2 (open), GPIO 3 (close)
#   South Gate: GPIO 14 (open), GPIO 15 (close)
#   Driveway Light: GPIO 27 (on/off with maintainState)
#   Entrance Gate: GPIO 17 (toggle) - DISABLED
#
# SAFETY NOTES:
#   - activeHigh: false means LOW activates the relay (common for relay modules)
#   - The gate moves while the pin is held LOW
#   - Gate controller has built-in limit switches (stops at end of travel)
#   - holdDurationMs: Maximum time to hold pin LOW for open/close operations
#   - NEVER send open and close simultaneously - this causes electrical issues
#   - The driver enforces mutual exclusion between open/close commands

version: 1

settings:
  # Cooldown between commands on the same device (prevents rapid toggling)
  defaultCooldownMs: 2000
  logLevel: info
  maintenanceMode: false

locations:
  - id: home
    name: Home
    enabled: true
    metadata:
      description: "Sile Bay residence gate control system"
    areas:
      - id: garage
        name: Garage Gates
        enabled: true
        devices:
          # North Gate - Main driveway entrance
          # GPIO 2 = open, GPIO 3 = close
          # LOW activates relay (closes circuit), HIGH deactivates (opens circuit)
          # Gate moves while relay is closed, limit switches stop motor at end of travel
          - id: north-gate
            name: North Gate
            deviceType: gate
            enabled: true
            driver: gpio
            capabilities:
              - open
              - close
              - stop
            config:
              openPin: 2
              closePin: 3
              # pulseDurationMs is for toggle operations, not used for open/close when holdDurationMs is set
              pulseDurationMs: 500
              # Maximum gate travel time - hold pin LOW for this duration
              # Gate's limit switches will stop motor when fully open/closed
              # Set to max travel time (e.g., 45 seconds for a large gate)
              holdDurationMs: 15000
              # LOW = relay active (gate moves), HIGH = relay inactive (gate stops)
              activeHigh: false
            metadata:
              notes: "Garage north gate"
              physicalLocation: "Front of property, north side"

          # South Gate - Secondary entrance
          # GPIO 14 = open, GPIO 15 = close
          # Same operation as North Gate
          - id: south-gate
            name: South Gate
            deviceType: gate
            enabled: true
            driver: gpio
            capabilities:
              - open
              - close
              - stop
            config:
              openPin: 14
              closePin: 15
              pulseDurationMs: 500
              # Max travel time for south gate
              holdDurationMs: 15000
              activeHigh: false
            metadata:
              notes: "Garage south gate"
              physicalLocation: "Front of property, south side"

      - id: utilities
        name: Utilities
        enabled: true
        devices:
          # Driveway Light - Utility with on/off control
          # GPIO 27 = on/off with maintainState (relay stays on until off command)
          - id: driveway-light
            name: Driveway Light
            deviceType: utility
            enabled: true
            driver: gpio
            # For maintainState utilities, capabilities are not listed here.
            # The toggle switch UI handles on/off automatically.
            # Permissions control whether a user can turn on vs turn off.
            capabilities: []
            config:
              # For utilities with on/off, we use a single pin
              onPin: 27
              offPin: 27
              # maintainState: relay stays on until explicit off command
              maintainState: true
              activeHigh: false
            metadata:
              notes: "Driveway area lighting control"
              type: "lighting"

      - id: entrance
        name: Entrance
        enabled: true
        devices:
          # Entrance Gate - Currently DISABLED
          # GPIO 17 = toggle (shared pin with driveway light when enabled)
          # NOTE: This gate is disabled - commands will be rejected
          - id: entrance-gate
            name: Entrance Gate
            deviceType: gate
            enabled: false
            driver: gpio
            capabilities:
              - toggle
            config:
              togglePin: 17
              pulseDurationMs: 500
              activeHigh: false
            metadata:
              notes: "Currently under maintenance - DISABLED"
              disabledReason: "Pending hardware installation"
