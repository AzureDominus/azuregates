# Docker Compose Configuration for AzureGates
# This file is used for deploying to a Raspberry Pi or other production environment
#
# Images are pulled from GHCR: ghcr.io/azuredominus/azuregates-*
# To build locally instead, use: docker compose build

services:
  # Reverse Proxy - Single entrypoint
  proxy:
    image: caddy:2-alpine
    container_name: gates-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CUSTOM_DOMAIN=${CUSTOM_DOMAIN:-}
      - LOCAL_HOSTS=${LOCAL_HOSTS:-gates.local, garagepi.local, localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - frontend
      - backend

  # Frontend SPA (production build)
  frontend:
    image: ghcr.io/azuredominus/azuregates-frontend:${GATES_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gates-frontend
    restart: unless-stopped
    networks:
      - edge

  # Backend API
  backend:
    image: ghcr.io/azuredominus/azuregates-backend:${GATES_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gates-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://gates:${POSTGRES_PASSWORD}@postgres:5432/gates}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SESSION_SECRET=${SESSION_SECRET}
      # Authentik OIDC Configuration
      - AUTHENTIK_URL=${AUTHENTIK_URL:-https://authentik:9443}
      - AUTHENTIK_EXTERNAL_URL=${AUTHENTIK_EXTERNAL_URL:-http://gates.local/auth}
      - AUTHENTIK_LOCAL_URL=${AUTHENTIK_LOCAL_URL:-https://garagepi.local:9443}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - AUTHENTIK_SLUG=${AUTHENTIK_SLUG:-azure-gates}
      - AUTHENTIK_ADMIN_GROUP=${AUTHENTIK_ADMIN_GROUP:-gates-admin}
      # Application Settings
      - BASE_URL=${BASE_URL:-http://gates.local}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # GPIO Service - Python service running on host for GPIO control
      - GPIO_SERVICE_URL=${GPIO_SERVICE_URL:-http://172.17.0.1:5000}
      # Config file settings
      - CONFIG_PATH=/app/config
      - GATES_CONFIG_FILE=${GATES_CONFIG_FILE:-gates.yaml}
    volumes:
      - ./config:/app/config
    # No device mounts needed - GPIO is handled by host Python service
    networks:
      - edge
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: gates-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gates}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-gates}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gates"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for sessions)
  redis:
    image: redis:8-alpine
    container_name: gates-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Authentik Server (Self-hosted Identity Provider)
  authentik:
    image: ghcr.io/goauthentik/server:2025.10.3
    container_name: gates-authentik
    restart: unless-stopped
    command: server
    ports:
      - "9443:9443"
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_REDIS__HOST=redis
      - AUTHENTIK_POSTGRESQL__HOST=postgres
      - AUTHENTIK_POSTGRESQL__USER=${POSTGRES_USER:-gates}
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Authentik Worker
  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10.3
    container_name: gates-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_REDIS__HOST=redis
      - AUTHENTIK_POSTGRESQL__HOST=postgres
      - AUTHENTIK_POSTGRESQL__USER=${POSTGRES_USER:-gates}
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Cloudflare Tunnel for secure remote access (optional)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gates-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - edge
    profiles:
      - remote-access
    depends_on:
      - proxy

  # Auto-updater service
  watchtower:
    image: containrrr/watchtower
    container_name: gates-watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400  # Check every 24 hours
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${NOTIFICATION_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    profiles:
      - auto-update

networks:
  edge:
    name: gates-edge
  internal:
    name: gates-internal
    internal: true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  authentik_media:
  authentik_templates:
